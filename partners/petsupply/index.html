<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petsupply — Dog &amp; Cat Deals</title>
<!-- Origin-trial token for this origin (paste once issued):
<meta http-equiv="origin-trial" content="TOKEN_GOES_HERE">
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fafaf7; color: #1f2a24; line-height: 1.5;
  }
  header.top {
    background: #2f6b4f; color: #fff; padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.top .brand { font-weight: 800; font-size: 20px; letter-spacing: .2px; }
  header.top .tag { font-size: 13px; opacity: .9; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .banner { border-radius: 12px; padding: 16px 20px;
    background: #eaf4ec; margin-bottom: 22px; }
  .banner b { color: #2f6b4f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #e6e3da; border-radius: 12px; padding: 16px; }
  .card .thumb { width: 64px; height: 64px; border-radius: 10px; background:#eef1ec;
    object-fit: cover; margin-bottom: 10px; display:block; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .cat { color: #7a847c; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .card .price { margin-top: 8px; }
  .card .deal { color: #2f6b4f; font-weight: 800; font-size: 18px; }
  .card .list { color: #9aa39c; text-decoration: line-through; font-size: 14px; margin-right: 8px; }
  .card .expiry { font-size: 12px; color: #c2542c; margin-top: 6px; }
  .card .save { background:#eaf4ec; color:#2f6b4f; border-radius:999px; padding:2px 8px; font-size:12px; font-weight:700; }
  footer { text-align:center; color:#9aa39c; font-size:12px; padding: 24px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">🐕 Petsupply</div>
  <div class="tag">Dog &amp; cat deals, direct from the shop</div>
</header>
<main>
  <div class="banner">Today's dog-food specials are live — <b>Kibble 12kg and Hearty Treats</b> drop to their lowest prices at midnight. Deals are verified by Petsupply.</div>
  <div class="grid" id="grid"><p>Loading catalog…</p></div>
</main>
<footer>Petsupply · Deals expire daily · Prices in USD</footer>

<script type="module" src="./tool.js"></script>
<script type="module" src="./storefront.js"></script>
</body>
</html>

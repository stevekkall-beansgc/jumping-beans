name: Jumping Beans checks

on:
  push:
  pull_request:

jobs:
  verify:
    # Keep untrusted fork PRs off the persistent self-hosted Mac.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'beans-mac' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-inventory-index.mjs
      - run: node scripts/check-product.mjs

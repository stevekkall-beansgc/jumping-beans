name: Deploy Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to publish the checked-out main branch
        required: true
        type: string

concurrency:
  group: jumping-beans-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'release' || github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }

      - name: Verify the release bundle
        run: |
          node scripts/check-product.mjs
          node scripts/sync-static-ui.mjs --check
          node engine/bundle-static.mjs --check

      - name: Deploy engine Worker
        working-directory: engine
        run: npx --yes wrangler@4.125.0 deploy

      - name: Deploy Petsupply Pages
        working-directory: partners/petsupply
        run: npx --yes wrangler@4.125.0 pages deploy . --project-name petsupply --branch main

      - name: Deploy Coffee Pages
        working-directory: partners/coffee
        run: npx --yes wrangler@4.125.0 pages deploy . --project-name coffee --branch main

      - name: Deploy Watch Pages
        working-directory: partners/watch
        run: npx --yes wrangler@4.125.0 pages deploy . --project-name watch --branch main
